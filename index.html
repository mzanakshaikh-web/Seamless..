
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09090d">
<title>Seamless Music Player</title>

<style>
:root {
    --accent: #a78bfa;
    --bg: #09090d;
    --panel: #17171f;
    --text: #ffffff;
    --muted: #a1a1aa;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, sans-serif;
}

header {
    padding: 25px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin: 5px 0 0;
    color: var(--muted);
    font-size: 13px;
}

button {
    border: none;
    cursor: pointer;
    color: white;
    background: var(--panel);
    padding: 12px 18px;
    border-radius: 30px;
}

button:active {
    transform: scale(.96);
}

.accent {
    background: var(--accent);
    color: #111;
}

main {
    padding: 0 20px 100px;
    max-width: 600px;
    margin: auto;
}

.cover {
    width: 100%;
    aspect-ratio: 1;
    max-height: 320px;
    border-radius: 24px;
    background: linear-gradient(135deg, #312e81, #09090d);
    display: grid;
    place-items: center;
    margin-bottom: 25px;
    overflow: hidden;
}

.cover span {
    font-size: 100px;
    color: var(--accent);
    transition: transform 1s ease;
}

.cover.playing span {
    transform: rotate(360deg);
}

.track-info {
    text-align: center;
}

.track-info h2 {
    margin-bottom: 5px;
}

.track-info p {
    margin-top: 0;
    color: var(--muted);
}

.progress {
    width: 100%;
    accent-color: var(--accent);
}

.time {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 12px;
}

.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin: 20px 0;
}

.play {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    font-size: 24px;
}

.features {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin: 25px 0;
}

.feature {
    flex: 1;
    text-align: center;
    padding: 15px 5px;
    background: var(--panel);
    border-radius: 16px;
    font-size: 13px;
}

.feature small {
    display: block;
    color: var(--muted);
    margin-top: 5px;
}

h3 {
    margin-top: 30px;
}

.song {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px;
    border-radius: 14px;
    background: var(--panel);
    margin-bottom: 8px;
    cursor: pointer;
}

.song.active {
    border: 1px solid var(--accent);
}

.song-icon {
    width: 45px;
    height: 45px;
    border-radius: 10px;
    background: #272331;
    display: grid;
    place-items: center;
}

.song-info {
    flex: 1;
    min-width: 0;
}

.song-info strong {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.song-info small {
    color: var(--muted);
}

.settings {
    display: none;
    background: var(--panel);
    padding: 18px;
    border-radius: 18px;
    margin-top: 20px;
}

.settings.show {
    display: block;
}

.settings label {
    display: block;
    margin: 15px 0;
}

.settings input,
.settings select {
    display: block;
    width: 100%;
    margin-top: 8px;
}

footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 25px;
}
</style>
</head>

<body>

<header>
    <div>
        <h1>Seamless</h1>
        <p>Your music. Without interruption.</p>
    </div>

    <button onclick="toggleSettings()">⚙</button>
</header>

<main>

    <div class="cover" id="cover">
        <span>♫</span>
    </div>

    <div class="track-info">
        <h2 id="title">Choose your music</h2>
        <p id="artist">Your phone's music library</p>
    </div>

    <input
        type="range"
        id="progress"
        class="progress"
        min="0"
        max="100"
        value="0"
    >

    <div class="time">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
    </div>

    <div class="controls">
        <button onclick="previousSong()">⏮</button>
        <button class="play accent" id="playButton"
            onclick="togglePlay()">▶</button>
        <button onclick="nextSong()">⏭</button>
    </div>

    <div class="features">
        <div class="feature">
            ∞ Infinity
            <small>Song blending</small>
        </div>

        <div class="feature">
            ♫ Lyrics
            <small>Offline support</small>
        </div>

        <div class="feature">
            ◐ Themes
            <small>Customize</small>
        </div>
    </div>

    <button class="accent" onclick="document.getElementById('fileInput').click()">
        + Add music from phone
    </button>

    <input
        type="file"
        id="fileInput"
        accept="audio/*"
        multiple
        hidden
    >

    <h3>Your music</h3>

    <div id="songList"></div>

    <div class="settings" id="settings">
        <h3>Appearance</h3>

        <label>
            Accent color
            <input type="color" id="accentColor" value="#a78bfa">
        </label>

        <label>
            Theme
            <select id="theme">
                <option value="dark">Dark</option>
                <option value="light">Light</option>
            </select>
        </label>

        <label>
            Infinity crossfade
            <input type="range" id="crossfade"
                min="0" max="12" value="5">
        </label>

        <button onclick="toggleInfinity()">
            Toggle Infinity
        </button>
    </div>

</main>

<footer>
    Developed by Shaikh Mzanak
</footer>

<audio id="audio" preload="metadata"></audio>
<audio id="nextAudio" preload="metadata"></audio>

<script>
const audio = document.getElementById("audio");
const nextAudio = document.getElementById("nextAudio");

let songs = [];
let currentIndex = -1;
let infinity = true;
let fading = false;
let nextReady = false;

const fileInput = document.getElementById("fileInput");

function formatTime(seconds) {
    if (!Number.isFinite(seconds)) return "0:00";

    const minutes = Math.floor(seconds / 60);
    const remaining = Math.floor(seconds % 60);

    return minutes + ":" + String(remaining).padStart(2, "0");
}

function toggleSettings() {
    document.getElementById("settings")
        .classList.toggle("show");
}

function loadSongs(files) {
    songs = Array.from(files).map(file => ({
        file,
        url: URL.createObjectURL(file),
        title: file.name.replace(/\.[^/.]+$/, ""),
        artist: "Local music"
    }));

    currentIndex = -1;
    renderSongs();
}

fileInput.addEventListener("change", event => {
    loadSongs(event.target.files);
});

function renderSongs() {
    const list = document.getElementById("songList");
    list.innerHTML = "";

    songs.forEach((song, index) => {
        const item = document.createElement("div");

        item.className = "song" +
            (index === currentIndex ? " active" : "");

        item.innerHTML = `
            <div class="song-icon">♫</div>
            <div class="song-info">
                <strong></strong>
                <small>${song.artist}</small>
            </div>
        `;

        item.querySelector("strong").textContent = song.title;

        item.addEventListener("click", () => playSong(index));

        list.appendChild(item);
    });
}

function playSong(index) {
    if (index < 0 || index >= songs.length) return;

    currentIndex = index;
    fading = false;
    nextReady = false;

    audio.pause();
    nextAudio.pause();

    audio.src = songs[index].url;
    audio.volume = 1;
    audio.load();

    audio.play().catch(() => {});

    document.getElementById("title").textContent =
        songs[index].title;

    document.getElementById("artist").textContent =
        songs[index].artist;

    document.getElementById("playButton").textContent = "Ⅱ";

    document.getElementById("cover").classList.add("playing");

    renderSongs();
}

function togglePlay() {
    if (currentIndex === -1) {
        if (songs.length) playSong(0);
        return;
    }

    if (audio.paused) {
        audio.play();
        document.getElementById("playButton").textContent = "Ⅱ";
        document.getElementById("cover").classList.add("playing");
    } else {
        audio.pause();
        document.getElementById("playButton").textContent = "▶";
        document.getElementById("cover").classList.remove("playing");
    }
}

function nextSong() {
    if (!songs.length) return;

    playSong((currentIndex + 1) % songs.length);
}

function previousSong() {
    if (!songs.length) return;

    if (audio.currentTime > 3) {
        audio.currentTime = 0;
    } else {
        playSong((currentIndex - 1 + songs.length) % songs.length);
    }
}

function toggleInfinity() {
    infinity = !infinity;
    fading = false;
    nextReady = false;
}

function prepareNext() {
    if (!infinity || songs.length < 2 || nextReady) return;

    const nextIndex = (currentIndex + 1) % songs.length;

    nextAudio.src = songs[nextIndex].url;
    nextAudio.load();
    nextReady = true;
}

audio.addEventListener("timeupdate", () => {
    if (!audio.duration) return;

    const remaining = audio.duration - audio.currentTime;

    document.getElementById("progress").value =
        (audio.currentTime / audio.duration) * 100;

    document.getElementById("currentTime").textContent =
        formatTime(audio.currentTime);

    document.getElementById("duration").textContent =
        formatTime(audio.duration);

    const crossfade = Number(
        document.getElementById("crossfade").value
    );

    if (infinity && remaining <= crossfade + 1) {
        prepareNext();
    }

    if (infinity && nextReady && remaining <= crossfade && !fading) {
        fading = true;
        nextAudio.currentTime = 0;

        nextAudio.volume = 0;
        nextAudio.play().catch(() => {});

        const start = performance.now();
        const duration = Math.max(crossfade, 1) * 1000;

        function blend(now) {
            const progress = Math.min((now - start) / duration, 1);

            audio.volume = 1 - progress;
            nextAudio.volume = progress;

            if (progress < 1) {
                requestAnimationFrame(blend);
            } else {
                audio.pause();

                const oldAudio = audio.src;

                audio.src = nextAudio.src;
                audio.currentTime = nextAudio.currentTime;
                audio.volume = 1;

                nextAudio.pause();

                currentIndex = (currentIndex + 1) % songs.length;

                document.getElementById("title").textContent =
                    songs[currentIndex].title;

                document.getElementById("artist").textContent =
                    songs[currentIndex].artist;

                nextReady = false;
                fading = false;

                renderSongs();
            }
        }

        requestAnimationFrame(blend);
    }
});

audio.addEventListener("ended", () => {
    if (!infinity) nextSong();
});

document.getElementById("progress").addEventListener("input", event => {
    if (audio.duration) {
        audio.currentTime =
            (event.target.value / 100) * audio.duration;
    }
});

document.getElementById("accentColor").addEventListener("input", event => {
    document.documentElement.style.setProperty(
        "--accent",
        event.target.value
    );
});

document.getElementById("theme").addEventListener("change", event => {
    if (event.target.value === "light") {
        document.documentElement.style.setProperty("--bg", "#f5f5f5");
        document.documentElement.style.setProperty("--panel", "#e4e4e7");
        document.documentElement.style.setProperty("--text", "#18181b");
        document.documentElement.style.setProperty("--muted", "#52525b");
    } else {
        document.documentElement.style.setProperty("--bg", "#09090d");
        document.documentElement.style.setProperty("--panel", "#17171f");
        document.documentElement.style.setProperty("--text", "#ffffff");
        document.documentElement.style.setProperty("--muted", "#a1a1aa");
    }
});
</script>

</body>
</html>
